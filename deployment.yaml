apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-api
  template:
    metadata:
      labels:
        app: my-api
    spec:
      containers:
        - name: my-api
          image: 257394491342.dkr.ecr.eu-north-1.amazonaws.com/my-api:v1
          ports:
            - containerPort: 8080